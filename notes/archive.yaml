- human: Tiered long-run reset warnings
  done: true
  ai: |
    Done (commit cb6dce6). Re-running a processed filter whose last run took more than 60s / 10m / 1h pops a ConfirmResetModal (src/renderer/components/ FilterModals.tsx). Three independent severity tiers (config flags warnOnReset60s / warnOnReset10m / warnOnReset1h). Only the LOWEST un-silenced tier the run's duration qualifies for is shown, one at a time — so a first-ever re-run of a 1h filter shows only the 60s warning; silence it and the next qualifying run shows the 10m one, then the 1h one. Each tier's "don't warn again" checkbox silences only that tier. Run duration is tracked as Filter.lastRunMs (src/models/Filter.ts) and persisted via Archive. Gate logic is in Filters.tsx runFilter.
