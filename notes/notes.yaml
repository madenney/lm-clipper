- human: Persist filter run progress periodically so a crashed run shows the real number, not 0
  done: false
  ai: |
    BUG/UX (found 2026-06-21 during real crash recovery on the 46GB full_db.lunar project). After a PC crash 20% into a ~12h edgeguard2 run, reopening showed the filter at "0 / 2,815,620" even though 1,893,957 result rows were committed and durable. Devastating to see as a user — looks like all the work was lost when it wasn't.

    ROOT CAUSE: the live progress count (`lastProgress`) in src/models/Filter.ts run3() is tracked IN MEMORY and streamed to the UI, but it is only ever written to the DB column `filter_runs.processed` on a clean Stop or normal completion (src/main/managers/FilterExecutor.ts ~line 284, `updateFilterRunProgressAsync(path, filterId, lastProgress)`). During a normal in-flight run it is NEVER persisted, so it sits at the initial 0 written by upsertFilterRun (src/main/db.ts ~line 397, `VALUES (?, ?, ?, 'running', ?)`). A crash therefore leaves processed=0. On reopen, DbWorker.ts (~line 473-482) detects the resumable run (status==='running' AND run.params_json === JSON.stringify(filter.params)) and sets filter.resumeProgress = { processed: run.processed ?? 0, totalInput: run.total_input } → UI renders 0/total. The RESULTS are fine (resume rebuilds its skip-set from getProcessedSourceIds = DISTINCT _sourceId in the results table, not from the counter), only the displayed number is wrong.

    FIX (primary): in Filter.ts run3(), inside the worker 'progress' message handler where `lastProgress` already updates on every message (around Filter.ts:235-252, right after `lastProgress = totalCompleted`), add a THROTTLED persist of lastProgress to filter_runs.processed via the existing updateFilterRunProgressAsync helper (already used by FilterExecutor; import into Filter.ts from ../main/dbAsync). Throttle to ~every 2s (time-based, Date.now() is fine in app runtime — the no-Date rule only applies to Workflow scripts) so it's a couple cheap single-row UPDATEs/sec through DbWorker, NOT per-row. Then a crash leaves an accurate recent number (lose at most ~2s) and reopen shows e.g. "612,000 / 2,815,620".

    FIX (bonus, belt-and-suspenders): in DbWorker.ts resumable detection (~line 479), if run.processed is 0/falsy but the results table is non-empty, fall back to a committed count so even an un-checkpointed crash never shows a flat 0. Note unit mismatch: total_input counts INPUT games; the results table row count is CLIPS and DISTINCT _sourceId is games-that-produced-clips (a lower bound on games processed, since zero-clip games aren't tracked). DISTINCT _sourceId is the most honest fallback but COUNT(DISTINCT JSON_EXTRACT(JSON,'$._sourceId')) scans the table (~seconds on 1.9M rows) — acceptable on open, or skip the bonus and rely on the primary fix.

    SCOPE/GOTCHAS: touches src/models/Filter.ts (+ maybe DbWorker.ts) — both are bundled into the main webpack build, so taking effect needs `NODE_ENV=development TS_NODE_TRANSPILE_ONLY=true npx webpack --config ./.erb/configs/webpack.config.main.dev.ts` AND an app restart (electronmon restart alone runs stale code). DO THIS ONLY AFTER the current ~12h edgeguard2 resume run finishes — a rebuild/restart would kill it. This fix is for FUTURE runs; it cannot retroactively fix the current run's already-baked processed=0 record. Add a jest test (the progress-persist throttle / resumeProgress derivation) to keep tsc+jest green.
