- human: Free Windows code signing via SignPath Foundation before GA
  done: false
  ai: |
    Windows builds ship UNSIGNED. Consequence: SmartScreen shows an "unknown publisher" warning on install (the user must click More info -> Run anyway), and some AV products flag an unsigned Electron installer. Auto-update DOES still work unsigned — electron-updater only enforces a publisher match when the build was signed to begin with. So this is a trust/conversion problem, not a functional one.

    A commercial OV cert is ~$200-400/yr; an EV cert (which clears SmartScreen immediately) costs more. The user will not pay. SignPath Foundation (signpath.org) grants FREE code-signing certificates to qualifying OPEN-SOURCE projects, which lm-clipper is (public repo, github.com/madenney/lm-clipper). Signing happens through their hosted service — you never hold the private key; CI calls out to SignPath, which signs the artifact and hands it back.

    STEPS: (1) apply to the Foundation programme with the repo URL — approval is MANUAL and slow, so start early; (2) once approved, add the SignPath step to .github/workflows/release.yml; (3) set win.publisherName in package.json to the exact CN on the issued certificate, so electron-updater's signature check passes on subsequent updates; (4) store the SignPath API token as a repo secret.

    ORDERING TRAP, do not miss this: signing CHANGES THE BYTES, hence the hash. The update manifest (beta.yml / latest.yml) embeds a sha512 of the installer. If you sign AFTER electron-builder writes the manifest, the manifest describes the UNSIGNED file and every auto-update will fail integrity verification — a silent, total breakage exactly like the artifactName bug. So sign INSIDE the electron-builder pipeline (it exposes a `sign` hook) or regenerate the manifests after signing, and re-compute SHA256SUMS afterwards too. Then verify with a real download+install, not by eyeballing CI.

    Do before stable GA. See RELEASING.md "Code signing".
- human: Tune what's left of edgeguard detection — isRecoveryMove and the KO gate
  done: false
  ai: |
    Two deliberately-deferred soft spots remain in src/models/methods/edgeguard.ts. (The other two items from the original "tune edgeguard2" todo — the per-character recoveryRange values and the score weights — were CLOSED on 2026-07-13; see the archived "Rebuild the edgeguard parser" entry.)

    (1) isRecoveryMove treats ANY actionStateId >= 341 as a recovery move. In Melee, 0-340 are universal states and 341+ are per-character, so offstage this is USUALLY an up-B/side-B — but it also catches every other character-specific state (aerials, specials thrown out as attacks, etc.). This is the main remaining false-positive risk: a victim who throws an offstage aerial can be scored as "attempting to recover", which feeds recoveryFrame, recoveryAttempts (the single strongest term in the score) and gate (a). A per-character up-B/side-B whitelist would be precise but high-maintenance. Measure first: how many detected clips hinge on a >=341 state that is NOT a recovery special?

    (2) The KO gate rejects a death above the top blast zone as "off the top", which wrongly rejects side-kills near the TOP CORNER (launched out AND up, crossing the side blastzone while high). Tighten to something like `death.y >= bz.yMax && Math.abs(death.x) < ledge` so only a genuinely central top-KO is rejected. Note bz.yMax now comes from stageGeometry.ts (libmelee BLASTZONES); rectangles.ts is deleted.
