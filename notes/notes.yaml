- human: Generate the 650 character-matchup edgeguard filter configs
  done: false
  ai: |
    Goal: a clip set of every character edgeguarding every other character. Melee has 26 characters (Slippi IDs 0-25, Zelda/Sheik counted separately), so 26x25 = 650 ordered (edgeguarder, edgeguardee) pairs — 676 if you include mirrors. Edgeguarding is directional so the pairs are ordered. Plan: one Edgeguards Parser run, then 650 Edgeguards Filter configs each pinned to a (comboerChar, comboeeChar) pair. Don't hand-click 650 of them — generate the filter param objects programmatically. Filter type id is 'edgeguardFilter' (src/models/methods/edgeguardFilter.ts); relevant params are comboerChar / comboeeChar (arrays of Slippi char ids). Char ids are in src/constants/recoveryData.ts and characters. Not started — was offered, user hasn't decided on the generation approach yet.
- human: Tune edgeguard2 detection and scoring
  done: false
  ai: |
    src/models/methods/edgeguard2.ts has known, deliberately-deferred soft spots: (1) `isRecoveryMove` treats any actionStateId >= 341 as a recovery move, which catches ALL character-specific states, not just up-B/side-B — main false- positive risk; a per-character up-B/side-B whitelist would be precise but high-maintenance. (2) The KO gate rejects `death.y >= rects.bz.yMax` as "off the top", which wrongly rejects side-kills near the top corner — could tighten to `death.y >= bz.yMax && Math.abs(death.x) < edge.xMax`. (3) Per-character `recoveryRange` values in src/constants/recoveryData.ts are rough estimates meant to be tuned. (4) Score weights (hits*3 + offstageFrames/30 + edgeguarderOffstage 4 + ledgeSteal 2 + maxDepthX/50 + depthFactor 0-2) are heuristic; effective range ~3-40, 5-15 typical, 20+ = long/deep/multi-hit. All left as-is pending review against real results.
