- human: BUG — a crashed filter run shows 0/total instead of the real progress
  done: false
  ai: |
    BUG/UX (found 2026-06-21 during real crash recovery on the 46GB full_db.lunar project). After a PC crash 20% into a ~12h edgeguard run, reopening showed the filter at "0 / 2,815,620" even though 1,893,957 result rows were committed and durable. Devastating to see as a user — looks like all the work was lost when it wasn't.

    ROOT CAUSE: the live progress count (`lastProgress`) in src/models/Filter.ts run3() is tracked IN MEMORY and streamed to the UI, but it is only ever written to the DB column `filter_runs.processed` on a clean Stop or normal completion (src/main/managers/FilterExecutor.ts ~line 284, `updateFilterRunProgressAsync(path, filterId, lastProgress)`). During a normal in-flight run it is NEVER persisted, so it sits at the initial 0 written by upsertFilterRun (src/main/db.ts ~line 397, `VALUES (?, ?, ?, 'running', ?)`). A crash therefore leaves processed=0. On reopen, DbWorker.ts (~line 473-482) detects the resumable run (status==='running' AND run.params_json === JSON.stringify(filter.params)) and sets filter.resumeProgress = { processed: run.processed ?? 0, totalInput: run.total_input } -> UI renders 0/total. The RESULTS are fine (resume rebuilds its skip-set from getProcessedSourceIds = DISTINCT _sourceId in the results table, not from the counter), only the displayed number is wrong.

    FIX (primary): in Filter.ts run3(), inside the worker 'progress' message handler where `lastProgress` already updates on every message (right after `lastProgress = totalCompleted`), add a THROTTLED persist of lastProgress to filter_runs.processed via the existing updateFilterRunProgressAsync helper (already used by FilterExecutor; import into Filter.ts from ../main/dbAsync). Throttle to ~every 2s (time-based; Date.now() is fine in app runtime — the no-Date rule only applies to Workflow scripts) so it's a couple of cheap single-row UPDATEs/sec through DbWorker, NOT per-row. Then a crash leaves an accurate recent number (lose at most ~2s) and reopen shows e.g. "612,000 / 2,815,620".

    FIX (bonus, belt-and-suspenders): in DbWorker.ts resumable detection (~line 479), if run.processed is 0/falsy but the results table is non-empty, fall back to a committed count so even an un-checkpointed crash never shows a flat 0. Note unit mismatch: total_input counts INPUT games; the results table row count is CLIPS and DISTINCT _sourceId is games-that-produced-clips (a lower bound on games processed, since zero-clip games aren't tracked). DISTINCT _sourceId is the most honest fallback but COUNT(DISTINCT JSON_EXTRACT(JSON,'$._sourceId')) scans the table (~seconds on 1.9M rows) — acceptable on open, or skip the bonus and rely on the primary fix.

    SCOPE/GOTCHAS: touches src/models/Filter.ts (+ maybe DbWorker.ts) — both are bundled into the main webpack build, so taking effect needs `NODE_ENV=development TS_NODE_TRANSPILE_ONLY=true npx webpack --config ./.erb/configs/webpack.config.main.dev.ts` AND an app restart (electronmon restart alone runs stale code). Add a jest test to keep the tsc + jest gates green. Pairs naturally with the cachedCounts bug below — same files, same rebuild+restart requirement.
- human: BUG — a completed filter shows a frozen mid-run result count
  done: false
  ai: |
    BUG (found 2026-06-23 on the 56GB full_db.lunar project). After the 7.8M-row edgeguard run completed, the filter card showed "17,427" results instead of 7,803,511 — and Ctrl+R kept re-showing 17,427. The actual table was fine (7,803,511 rows); only the displayed count was wrong, frozen at a stale mid-run value. Very alarming to a user (looks like 35h of results vanished).

    ROOT CAUSE: two separate count fields get out of sync. (1) `filter.results` — set correctly at completion. (2) `cachedCounts[filterId]` in metadata.extra — the value the UI actually trusts. cachedCounts is ONLY ever written by the lazy background counter (src/main/DbWorker.ts ~line 168, getFilterCount handler calls `cacheFilterCount(db, tableId, count)`). At some point mid-run a lazy count ran and cached 17,427; nothing invalidates/updates cachedCounts while a run keeps adding rows, so it stayed frozen as the table grew to 7.8M. Then getMetadata (DbWorker.ts ~line 435-439) OVERWRITES `filter.results` FROM cachedCounts on every read — so even the correct completion value gets clobbered by the stale cache. Compounding it: the completion finalize in FilterExecutor.ts (~line 289-360, withCompletionLock) uses getTableCountAsync (counts but does NOT cache) and evidently errored partway here (left isProcessed=false; the catch path re-reads stale metadata), so the cache was never refreshed.

    FIX (bulletproof, primary): invalidate cachedCounts[filterId] when a run STARTS (in FilterExecutor._executeFilter run-start, and for descendants reset on completion). With it null, getMetadata sets filter.results=null -> lazy re-hydration runs a live COUNT -> always truthful, even if completion errors (exactly the failure that bit us). Implement an invalidate either by a new DbWorker method (delete extra.cachedCounts[tableId]) or by writing a sentinel <0 (getMetadata treats `cachedCounts[id] >= 0 ? ... : null`, so any negative invalidates).
    FIX (avoid spinner, secondary): at completion, swap getTableCountAsync -> getFilterCountAsync (the latter COUNTS *and* caches via cacheFilterCount), so cachedCounts holds the true final count immediately. Also make completion finalize robust so a slow/failed COUNT can't leave isProcessed=false with a stale cache.

    SURGICAL FIX ALREADY APPLIED (2026-06-23) to the live + backup DB: set cachedCounts.filter_11504=7803511, results=7803511, isProcessed=true; metadata.path stamped to full_db.lunar. So the user's project is correct now; this todo is the CODE fix to prevent recurrence. Add a jest test.
