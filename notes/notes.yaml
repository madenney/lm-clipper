- human: Delete SQLite -wal/-shm sidecars at quit so a closed project is one file
  done: true
  ai: |
    Projects are WAL-mode SQLite, so each .lunar has -wal/-shm sidecars; they
    persisted at rest and confused the single-file-document feel. Fix: clean them
    up at app quit, once every connection is released. Two long-lived connections
    hold the file open (main dbConnection + the background DbWorker in dbAsync.ts),
    so the delete must come AFTER both close — and on Windows an open handle blocks
    unlink, so the DbWorker connection must be closed *gracefully*, not abruptly
    terminated. Implementation: DbWorker.ts handles a {__control:'close'} message
    (closes cachedDb, replies 'closed'); dbAsync.shutdownDbWorker() sends it,
    awaits the ack (1.5s cap), then terminates; main.ts before-quit is now async
    (preventDefault → shutdownCleanupAsync → app.exit(0)) with a 3s overall race so
    quit can't hang. shutdownCleanupAsync: capture project path → controller.cleanup
    → await shutdownDbWorker → closeDb (checkpoints WAL to 0 bytes) →
    removeWalSidecars(path). removeWalSidecars is GUARDED: never deletes a -wal with
    size>0 (un-checkpointed data / crash recovery), and any unlink failure is benign
    (left as today). Signals/crashes use the old sync shutdownCleanup (best-effort).
    Only cleans the currently-open project at quit; old leftover sidecars get
    cleaned when those projects are next opened+quit. Verified lint/tsc(127)/jest
    31/31 + main & DbWorker bundles rebuilt — but the actual "quit → folder shows one
    file" behavior needs eyeballing in a running build (esp. Windows).
